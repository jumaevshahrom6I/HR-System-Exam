services:
  postgres:
    image: postgres:17-alpine
    container_name: hr-postgres
    environment:
      # Значения берутся из .env. Если переменная не задана, compose остановится с ошибкой
      # (раньше подставлялись demo/demo, и база создавалась с неверным паролем).
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL-файлы из migrations выполняются один раз — при первом создании базы.
      # Изменили миграцию — пересоздайте базу: make infra-reset
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      # при первом запуске Postgres ещё применяет миграции: неудачные проверки в это время не считаются
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
